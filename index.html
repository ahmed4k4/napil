<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دعوة زفاف - شريف وهالة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Amiri:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #c8b57b;
        --dark-gold: #a8945a;
        --bg-paper: #fdfaf1;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f0f0f0;
        font-family: "Amiri", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* حاوية الهاتف المحمول */
      .mobile-frame {
        width: 100%;
        max-width: 430px; /* مقاس iPhone Pro Max */
        height: 100vh;
        background: var(--bg-paper);
        position: relative;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
        overflow-y: auto;
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
        scrollbar-width: none; /* إخفاء السكرول بار في Firefox */
      }
      .mobile-frame::-webkit-scrollbar {
        display: none;
      }

      /* الخلفية الموردة كما في الفيديو */
      .floral-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          url("https://www.transparenttextures.com/patterns/cream-paper.png"),
          url("https://i.ibb.co/3WfX9Vp/floral-overlay.png"); /* رابط تخيلي لزخارف ورد */
        background-size: cover;
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 40px 20px;
        text-align: center;
      }

      .top-banner {
        font-family: "Cinzel", serif;
        letter-spacing: 3px;
        font-size: 0.9rem;
        color: #444;
        margin-bottom: 50px;
        font-weight: 700;
      }

      /* --- الأنيميشن الخاص بالظرف --- */
      .envelope-wrapper {
        perspective: 1000px;
        margin: 60px auto;
        cursor: pointer;
        transition: transform 0.5s;
      }

      .envelope-wrapper:active {
        transform: scale(0.95);
      }

      .envelope {
        width: 280px;
        height: 180px;
        background: #f4edd4;
        position: relative;
        margin: 0 auto;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border: 1px solid #e3d5b0;
      }

      /* الغطاء العلوي للظرف */
      .envelope-flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-left: 140px solid transparent;
        border-right: 140px solid transparent;
        border-top: 100px solid #ece4c9;
        transform-origin: top;
        transition: transform 0.6s ease-in-out;
        z-index: 3;
      }

      .envelope.open .envelope-flap {
        transform: rotateX(180deg);
        z-index: 1;
      }

      /* الختم الشمعي */
      .wax-seal {
        position: absolute;
        top: 80px;
        left: 120px;
        width: 40px;
        height: 40px;
        background: #2b2b2b;
        border-radius: 50%;
        z-index: 4;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: opacity 0.4s;
      }
      .envelope.open .wax-seal {
        opacity: 0;
      }

      /* الكارت داخل الظرف */
      .card-preview {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 260px;
        height: 160px;
        background: white;
        z-index: 2;
        transition: transform 0.8s ease-in-out;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 1px solid #eee;
      }

      .envelope.open .card-preview {
        transform: translateY(-120px) scale(1.1);
      }

      /* --- تفاصيل الدعوة الرئيسية --- */
      #main-invite {
        display: none;
        opacity: 0;
        transition: opacity 1s ease;
      }

      .couple-names {
        font-family: "Great Vibes", cursive;
        font-size: 3.5rem;
        color: #1a1a1a;
        margin: 20px 0;
      }

      .details-text {
        font-family: "Cinzel", serif;
        font-size: 1.1rem;
        line-height: 2;
        color: #555;
      }

      .gold-divider {
        width: 150px;
        height: 2px;
        background: linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );
        margin: 25px auto;
      }

      /* العداد التنازلي المطور */
      .countdown-container {
        margin: 40px 0;
        padding: 20px;
        background: rgba(255, 255, 255, 0.8);
        border: 1.5px solid var(--gold);
        border-radius: 15px;
      }

      .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .time-val {
        font-size: 1.8rem;
        font-weight: bold;
        color: #333;
        display: block;
      }
      .time-label {
        font-size: 0.7rem;
        color: var(--gold);
        font-family: "Cinzel", sans-serif;
      }

      /* الخريطة والـ RSVP */
      .map-frame {
        width: 100%;
        height: 250px;
        border-radius: 12px;
        border: 3px solid #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }

      .rsvp-section {
        margin-top: 40px;
        padding-bottom: 60px;
      }

      .rsvp-input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: 1px solid #d3c4a1;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        text-align: center;
        font-size: 1rem;
      }

      .rsvp-btn {
        width: 100%;
        padding: 15px;
        background: #2b2b2b;
        color: white;
        border: none;
        border-radius: 8px;
        font-family: "Cinzel", serif;
        cursor: pointer;
        transition: 0.3s;
      }
      .rsvp-btn:hover {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="mobile-frame">
      <div class="floral-bg"></div>

      <div class="content">
        <div class="top-banner">T D E S I G N A T I O N</div>

        <!-- قسم الظرف التفاعلي -->
        <div
          id="envelope-trigger"
          class="envelope-wrapper"
          onclick="handleOpen()"
        >
          <div
            class="header-text"
            style="font-family: &quot;Cinzel&quot;; margin-bottom: 20px"
          >
            COME CELEBRATE WITH US
          </div>
          <div class="envelope" id="envelope-element">
            <div class="envelope-flap"></div>
            <div class="wax-seal"></div>
            <div class="card-preview">
              <p
                style="font-family: &quot;Great Vibes&quot;; font-size: 1.2rem"
              >
                S & H
              </p>
            </div>
          </div>
          <p
            style="
              margin-top: 20px;
              font-size: 0.8rem;
              color: #888;
              letter-spacing: 2px;
            "
          >
            TAP TO OPEN
          </p>
        </div>

        <!-- محتوى الدعوة الرئيسي -->
        <div id="main-invite">
          <img
            src="https://i.ibb.co/6P0S9Sg/wedding-couple.png"
            alt="Couple"
            style="width: 120px; margin-bottom: 10px"
          />

          <h1 class="couple-names">Sherif & Hala</h1>

          <div class="gold-divider"></div>

          <div class="details-text">
            <p>13TH OF APRIL 2026</p>
            <p>AT 6:00 PM</p>
            <p style="font-size: 0.9rem; margin-top: 10px">
              Al Aly Al Azim Mosque, Almaza
            </p>
            <p style="font-size: 0.9rem">Open Air Hall</p>
          </div>

          <div class="gold-divider"></div>

          <h2 style="font-family: &quot;Great Vibes&quot;; font-size: 2rem">
            Counting Down to Our Day
          </h2>

          <div class="countdown-container">
            <div class="timer-grid">
              <div>
                <span class="time-val" id="d">00</span
                ><span class="time-label">DAYS</span>
              </div>
              <div>
                <span class="time-val" id="h">00</span
                ><span class="time-label">HOURS</span>
              </div>
              <div>
                <span class="time-val" id="m">00</span
                ><span class="time-label">MINS</span>
              </div>
              <div>
                <span class="time-val" id="s">00</span
                ><span class="time-label">SECS</span>
              </div>
            </div>
          </div>

          <h2
            style="
              font-family: &quot;Great Vibes&quot;;
              font-size: 2.2rem;
              margin-top: 30px;
            "
          >
            Getting There
          </h2>
          <iframe
            class="map-frame"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3452.482!2d31.341!3d30.080!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x145815e98211b439%3A0xc0fb106b2ef874bd!2z2YXYs9iM2K8g2KfZhNi52YTZiiDYp9mE2LnYuNmK2YU!5e0!3m2!1sen!2seg!4v1714856000000"
            allowfullscreen=""
          ></iframe>

          <div class="rsvp-section">
            <h2
              style="
                font-family: &quot;Great Vibes&quot;;
                font-size: 2.2rem;
                margin-bottom: 20px;
              "
            >
              Leave Us a Message
            </h2>
            <input
              type="text"
              class="rsvp-input"
              id="userName"
              placeholder="اسمك الكريم"
            />
            <textarea
              class="rsvp-input"
              id="userMsg"
              rows="3"
              placeholder="اكتب تهنئتك هنا"
            ></textarea>
            <button class="rsvp-btn" onclick="sendRSVP()">
              إرسال التهنئة (RSVP)
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // التحكم في فتح الظرف
      function handleOpen() {
        const env = document.getElementById("envelope-element");
        const trigger = document.getElementById("envelope-trigger");
        const main = document.getElementById("main-invite");

        env.classList.add("open");

        // بعد انتهاء أنيميشن الظرف، نظهر بقية المحتوى ونخفي الظرف
        setTimeout(() => {
          trigger.style.transition = "all 1s";
          trigger.style.opacity = "0";
          trigger.style.transform = "translateY(-50px)";

          setTimeout(() => {
            trigger.style.display = "none";
            main.style.display = "block";
            setTimeout(() => (main.style.opacity = "1"), 100);
          }, 800);
        }, 1200);
      }

      // العداد التنازلي
      const targetDate = new Date("April 13, 2026 18:00:00").getTime();

      setInterval(() => {
        const now = new Date().getTime();
        const diff = targetDate - now;

        document.getElementById("d").innerText = Math.floor(
          diff / (1000 * 60 * 60 * 24),
        );
        document.getElementById("h").innerText = Math.floor(
          (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        document.getElementById("m").innerText = Math.floor(
          (diff % (1000 * 60 * 60)) / (1000 * 60),
        );
        document.getElementById("s").innerText = Math.floor(
          (diff % (1000 * 60)) / 1000,
        );
      }, 1000);

      function sendRSVP() {
        const name = document.getElementById("userName").value;
        if (name) {
          alert("شكراً لك يا " + name + "! تم حفظ تهنئتك بنجاح.");
        } else {
          alert("يرجى إدخال الاسم أولاً.");
        }
      }
    </script>
  </body>
</html>
