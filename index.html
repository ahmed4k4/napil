<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>دعوة زفاف | شريف & هالة | عداد حتى الزفاف</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Great+Vibes&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="3.css" />
  </head>
  <body>
    <div class="mobile-frame">
      <div class="floral-bg"></div>
      <div class="content">
        <div class="top-banner">✦ S & H ✦ SAVE THE DATE ✦</div>

        <div class="envelope-area" id="envelopeTrigger">
          <div class="envelope-3d">
            <div class="paper-envelope" id="dynamicEnvelope">
              <div class="flap"></div>
              <div class="seal-wax">S❤H</div>
              <div class="inner-card-preview">
                <p>شريف & هالة</p>
                <p>13 · 04 · 2026</p>
              </div>
            </div>
          </div>
          <div class="tap-hint">✨ افتح الدعوة ✨</div>
        </div>

        <div id="main-invite">
          <div class="couple-avatar">
            <img
              src="https://cdn-icons-png.flaticon.com/512/3171/3171920.png"
              alt="عروسان"
            />
          </div>
          <h1 class="couple-names">شريف & هالة</h1>
          <div class="gold-divider"></div>
          <div class="wedding-date">الإثنين 13 إبريل 2026</div>
          <div class="wedding-date" style="font-size: 1rem">
            الساعة 6:00 مساءً
          </div>
          <div class="location-text">مسجد آل العظيم – الماظة</div>
          <div class="location-text">قاعة الهواء الطلق</div>

          <div class="gold-divider"></div>

          <h2
            style="
              font-family: &quot;Great Vibes&quot;;
              font-size: 2rem;
              margin-bottom: 4px;
            "
          >
            عدنا الفرحة
          </h2>
          <div class="countdown-modern">
            <div class="time-card" id="daysCard">
              <span id="days" class="time-val">00</span
              ><span class="time-label">يوم</span>
            </div>
            <div class="time-card" id="hoursCard">
              <span id="hours" class="time-val">00</span
              ><span class="time-label">ساعة</span>
            </div>
            <div class="time-card" id="minutesCard">
              <span id="minutes" class="time-val">00</span
              ><span class="time-label">دقيقة</span>
            </div>
            <div class="time-card" id="secondsCard">
              <span id="seconds" class="time-val">00</span
              ><span class="time-label">ثانية</span>
            </div>
          </div>

          <div class="floating-icon"></div>

          <iframe
            class="map-modern"
            loading="lazy"
            id="mapFrame"
            allowfullscreen
          ></iframe>

          <div class="rsvp-glow">
            <h3
              style="
                font-family: &quot;Great Vibes&quot;;
                font-size: 2.4rem;
                color: #6a4e2a;
                margin-bottom: 10px;
              "
            >
              ♡ ر.س.ف.ب ♡
            </h3>
            <input
              type="text"
              id="guestName"
              class="rsvp-input"
              placeholder="اسمك الكريم"
              autocomplete="off"
            />
            <textarea
              id="guestMessage"
              class="rsvp-input"
              rows="2"
              placeholder="شاركنا كلمة تُفرح قلوبنا 🤍"
            ></textarea>
            <button class="rsvp-btn" id="sendRsvpBtn">✨ أرسل تهنئتك ✨</button>
          </div>
          <div class="footer-note">بإنتظاركم لنصنع معاً أجمل الذكريات</div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // =========================
        // تاريخ الزفاف
        // =========================
        const WEDDING_DATE = new Date(2026, 4, 14, 18, 0, 0);
        const MAX_DAYS = 30;

        // =========================
        // عناصر العداد
        // =========================
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

        // =========================
        // وقت الجهاز (ثابت وآمن)
        // =========================
        function getNow() {
          return new Date();
        }

        // =========================
        // العداد
        // =========================
        function updateCountdown() {
          const now = getNow();
          const diff = WEDDING_DATE - now;

          if (diff <= 0) {
            daysEl.textContent = "00";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";
            return;
          }

          const totalSeconds = Math.floor(diff / 1000);

          let days = Math.floor(totalSeconds / 86400);
          const hours = Math.floor((totalSeconds % 86400) / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;

          if (days > MAX_DAYS) days = MAX_DAYS;

          daysEl.textContent = String(days).padStart(2, "0");
          hoursEl.textContent = String(hours).padStart(2, "0");
          minutesEl.textContent = String(minutes).padStart(2, "0");
          secondsEl.textContent = String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // =========================
        // ========== أنيميشن فتح الظرف ==========
        const envelopeDiv = document.getElementById("dynamicEnvelope");
        const triggerArea = document.getElementById("envelopeTrigger");
        const mainInvite = document.getElementById("main-invite");
        let isOpened = false;
        let openingProgress = false;

        function openInvitation() {
          if (isOpened || openingProgress) return;
          openingProgress = true;

          // إضافة كلاس الفتح
          envelopeDiv.classList.add("opened");

          // بعد اكتمال حركة فتح الظرف
          setTimeout(() => {
            if (triggerArea) {
              triggerArea.style.transition =
                "opacity 0.8s ease, transform 0.7s ease";
              triggerArea.style.opacity = "0";
              triggerArea.style.transform = "translateY(-35px)";
            }

            setTimeout(() => {
              if (triggerArea) triggerArea.style.display = "none";
              mainInvite.style.display = "block";

              // إظهار الدعوة مع تأثير Fade
              setTimeout(() => {
                mainInvite.style.opacity = "1";
                // إضافة أنيميشن للعناصر الداخلية
                const animatedElements = document.querySelectorAll(
                  "#main-invite .couple-names, #main-invite .countdown-modern, #main-invite .map-modern, #main-invite .rsvp-glow, #main-invite .couple-avatar",
                );
                animatedElements.forEach((el, idx) => {
                  el.style.animation = `fadeSlideUp 0.5s ease forwards ${idx * 0.08}s`;
                  el.style.opacity = "0";
                  el.style.animationFillMode = "forwards";
                });
                // إعادة تشغيل العداد مرة أخرى لضمان تحديثه بعد ظهوره
                updateCountdown();
              }, 30);
              openingProgress = false;
              isOpened = true;
            }, 800);
          }, 1000);
        }

        // ربط الحدث
        if (triggerArea) {
          triggerArea.addEventListener("click", openInvitation);
        }

        // ========== وظيفة RSVP مع رسالة تأكيد جذابة ==========
        function sendRSVP() {
          const nameInput = document.getElementById("guestName");
          const msgInput = document.getElementById("guestMessage");
          const nameVal = nameInput.value.trim();
          const msgVal = msgInput.value.trim();

          if (nameVal === "") {
            alert("💌 من فضلك اكتب اسمك الكريم ليكتمل فرحنا بك.");
            nameInput.focus();
            return;
          }

          let confirmMsg = `🌹 شكراً جزيلاً ${nameVal}! 🌹\nتم استلام تهنئتك بنجاح.`;
          if (msgVal !== "") {
            confirmMsg += `\nرسالتك: "${msgVal.substring(0, 60)}"`;
          }
          confirmMsg += `\n\nننتظرك يوم 13 إبريل 2026 بفارغ الصبر 🤍`;
          alert(confirmMsg);

          // تفريغ الحقول
          nameInput.value = "";
          msgInput.value = "";
          nameInput.focus();

          // تغيير مؤقت لزر الإرسال
          const btn = document.getElementById("sendRsvpBtn");
          const originalText = btn.innerText;
          btn.innerText = "✓ تم الإرسال 🕊️";
          setTimeout(() => {
            btn.innerText = originalText;
          }, 2000);
        }

        const rsvpBtn = document.getElementById("sendRsvpBtn");
        if (rsvpBtn) {
          rsvpBtn.addEventListener("click", sendRSVP);
        }

        // التحقق من صحة صورة الأيقونة
        const coupleImg = document.querySelector(".couple-avatar img");
        if (coupleImg) {
          coupleImg.onerror = function () {
            this.src =
              "https://cdn-icons-png.flaticon.com/512/3171/3171920.png";
          };
        }

        // إضافة تأثيرات خلفية ديناميكية إضافية
        const bgDecor = document.createElement("div");
        bgDecor.style.position = "absolute";
        bgDecor.style.top = "0";
        bgDecor.style.left = "0";
        bgDecor.style.width = "100%";
        bgDecor.style.height = "100%";
        bgDecor.style.pointerEvents = "none";
        bgDecor.style.background =
          "radial-gradient(circle at 20% 40%, rgba(200,181,123,0.08) 0%, transparent 70%)";
        document.querySelector(".mobile-frame").appendChild(bgDecor);

        // أنيميشن تحويم الختم الشمعي
        const wax = document.querySelector(".seal-wax");
        if (wax) {
          wax.addEventListener("mouseenter", () => {
            if (!isOpened) wax.style.transform = "translateX(-50%) scale(1.05)";
          });
          wax.addEventListener("mouseleave", () => {
            if (!isOpened) wax.style.transform = "translateX(-50%) scale(1)";
          });
        }

        // =========================
        // خريطة Google Maps (مُصححة)
        // =========================

        const MAP_LAT = 30.0804153;
        const MAP_LNG = 31.3414963;

        const mapFrame = document.getElementById("mapFrame");

        if (mapFrame) {
          mapFrame.src = `https://www.google.com/maps?q=${MAP_LAT},${MAP_LNG}&z=17&output=embed`;
        }
      });
    </script>
  </body>
</html>
